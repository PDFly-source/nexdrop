name: Deploy NexDrop to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (crypto, pairing, protocol, storage)
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify export output
        run: |
          test -f out/index.html || (echo "out/index.html missing — static export failed" && exit 1)
          test -f out/sw.js || (echo "out/sw.js missing" && exit 1)
          test -f out/manifest.webmanifest || (echo "out/manifest.webmanifest missing" && exit 1)
          test -f out/icons/icon-192.png || (echo "icon-192 missing" && exit 1)

      - name: Add .nojekyll (bypass Jekyll processing)
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  two-device-e2e:
    # REAL two-device regression suite: two isolated Chromium sessions pair
    # over actual WebRTC (QR payload exchange -> DataChannels -> file
    # transfer with SHA-256 verification). Runners have a real ICE path,
    # unlike sandboxes. Failures here are real regressions, never skipped.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build static export
        run: npm run build

      - name: Run two-device end-to-end test
        run: NEXDROP_E2E_VERBOSE=1 npx tsx tests/e2e/two-device.test.ts

  transfer-benchmark:
    # Benchmark tier C — REAL two-device browser benchmark: pairs two
    # isolated Chromium sessions over real WebRTC (loopback host candidates
    # on the runner — a genuine DataChannel path, though not a physical
    # network) and transfers 100 MiB / 500 MiB / 1 GiB while sampling live
    # engine telemetry. Prints one [BENCH] JSON line per size — measured
    # values only (bytes/time/RTT/bufferedAmount/heap), never synthesized,
    # and no hard-coded pass speed: the job fails only on real transfer
    # failures (no completion, no SHA-256 verify), not on slow numbers.
    #
    # Tier A (deterministic protocol/unit suite: crypto, pairing codecs,
    # session state machines) runs inside the build job via `npm test`.
    # Tier B (browser integration) is covered by the two-device-e2e job,
    # which exercises the real browser pairing + transfer UI end to end.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build static export
        run: npm run build

      - name: Run two-device transfer benchmark
        run: npx tsx tests/e2e/benchmark.test.ts

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, two-device-e2e]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
