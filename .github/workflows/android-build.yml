name: Android Debug APK

# Mobile-only owner path (mission 2026-10-03): no Android Studio, phone only.
# GitHub → Actions → NexDrop-debug.apk artifact (+ Release) → download →
# install → test the REAL native NDT1 TCP transport.
#
# The APK is a real build of android/ (:ndt1 transport library + :app phone
# client + :tv receive-only). The PWA (WebRTC) is untouched by this workflow.

on:
  push:
    branches: ['main']
    paths: ['android/**', '.github/workflows/android-build.yml', '.github/scripts/android-smoke.sh']
  workflow_dispatch:

permissions:
  contents: write # create the Release with the attached APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (with cmdline-tools) already;
      # the android-actions/setup-android action broke on the runner image
      # ("Failed to find package 'tools'"), so accept licenses directly.
      - name: Android SDK (preinstalled; accept licenses)
        working-directory: android
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            "$SDKM" --version
            yes | "$SDKM" --licenses > /dev/null || true
            echo "licenses accepted via $SDKM"
          else
            echo "sdkmanager not found (runner SDK licenses are pre-accepted); continuing"
          fi

      - name: Gradle wrapper sanity (real wrapper, committed in-repo)
        working-directory: android
        run: ./gradlew --version

      # Routing-fix tests (2026-10-04): ANDROID_NATIVE_LOCAL endpoint
      # selection incl. the CGNAT 100.71.130.214 regression, plus real NDT1
      # TCP transfers BOTH directions over the bound endpoint.
      - name: Unit tests — LocalNet selection + NDT1 TCP both ways
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :ndt1:testDebugUnitTest

      - name: Build :app debug APK (native NDT1)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build :tv debug APK (receive-only)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :tv:assembleDebug

      - name: Verify the APK is real (not a fake/mock shell)
        working-directory: android
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          # The real NDT1 classes must be inside the APK
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/apkcheck
          for token in "com/nexdrop/ndt1/TurboSender" "com/nexdrop/ndt1/TurboReceiver" "com/nexdrop/ndt1/MainActivity"; do
            if ! grep -qa "$token" /tmp/apkcheck/classes*.dex; then
              echo "MISSING $token in APK — refusing to upload a fake APK"; exit 1
            fi
          done
          echo "APK verified: real NDT1 sender/receiver + phone UI present"

      - name: Startup guard — every manifest component must resolve to a REAL class
        working-directory: android
        run: |
          set -eu
          MERGED="$(find app/build/intermediates -path '*merged_manifests*debug*' -name 'AndroidManifest.xml' | head -1)"
          test -n "$MERGED" || { echo "merged manifest not found"; exit 1; }
          python3 - "$MERGED" <<'PYEOF'
          import sys, re, zipfile
          import xml.etree.ElementTree as ET
          merged, = sys.argv[1:]
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          z = zipfile.ZipFile(apk)
          dex = b"".join(z.read(n) for n in z.namelist() if re.match(r'classes\d*\.dex', n))
          ns = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse(merged).getroot()
          declared = []
          for tag in ('activity', 'activity-alias', 'service', 'receiver', 'provider'):
              for node in root.iter(tag):
                  name = node.get(ns + 'name')
                  if not name:
                      continue
                  if name.startswith('.'):
                      pkg = root.get('package')
                      name = pkg + name
                  declared.append((tag, name))
          # dex descriptors store classes slash-form: Lcom/nexdrop/ndt1/MainActivity;
          missing = [(t, n) for (t, n) in declared if n.startswith('com.nexdrop.') and n.replace('.', '/').encode() not in dex]
          if missing:
              for t, n in missing:
                  print(f"manifest declares {t} {n} but that class is NOT in the APK dex")
              print("STARTUP GUARD FAILED — the app would crash on launch with ClassNotFoundException")
              sys.exit(1)
          names = [n for _, n in declared]
          for must in ("com.nexdrop.ndt1.MainActivity", "com.nexdrop.ndt1.TransferService"):
              if must not in names:
                  print(f"expected component {must} missing from merged manifest")
                  sys.exit(1)
          print("startup guard OK: %d components declared, all resolve to real classes" % len(declared))
          PYEOF

      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NexDrop-debug.apk
          cp android/tv/build/outputs/apk/debug/tv-debug.apk NexDropTV-debug.apk

      - name: Upload NexDrop-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexDrop-debug.apk
          path: NexDrop-debug.apk
          if-no-files-found: error

      - name: Upload NexDropTV-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexDropTV-debug.apk
          path: NexDropTV-debug.apk
          if-no-files-found: error

  # Real launch verification (mission §8): the APK must actually start.
  # This job would have caught the shipped launch crash — the emulator
  # fails the run unless MainActivity appears with no FATAL EXCEPTION.
  startup-smoke:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (smoke-test script)
        uses: actions/checkout@v4

      - name: Download NexDrop-debug.apk artifact
        uses: actions/download-artifact@v4
        with:
          name: NexDrop-debug.apk

      # ubuntu-latest has KVM but the runner user is not in the kvm group
      # (ProbeKVM: "This user doesn't have permissions to use KVM"), which
      # forced TCG software emulation — an API 36 image cannot cold-boot
      # under TCG in the action's default 600 s. Open the device node.
      - name: Grant KVM access
        run: sudo chmod 666 /dev/kvm || true

      - name: Boot Android 16 (API 36) emulator and run the startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          emulator-boot-timeout: 1800
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-smoke.sh"

      - name: Upload logcat (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat
          path: |
            logcat.txt
            ui.xml
          if-no-files-found: ignore

  release:
    needs: [apk, startup-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: NexDrop-debug.apk
      - name: Download TV APK artifact
        uses: actions/download-artifact@v4
        with:
          name: NexDropTV-debug.apk

      - name: Create GitHub Release with the debug APK (phone-downloadable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="nexdrop-android-debug-${GITHUB_SHA::7}"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "NexDrop Android debug APK ($GITHUB_SHA)" \
              --notes "Debug APK built from $GITHUB_SHA by GitHub Actions.
          Install on your phone: download NexDrop-debug.apk, allow 'install unknown apps', then install. Contains the real native NDT1 TCP transport (TurboSender/TurboReceiver), ONE-QR pairing, Accept/Decline, pause/resume/cancel, streaming SHA-256 verification, 358 MB + 1 GB benchmarks, and the PWA (WebRTC) fallback.
          NexDropTV-debug.apk is the optional receive-only TV client." \
              --prerelease
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" NexDrop-debug.apk NexDropTV-debug.apk --clobber
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
