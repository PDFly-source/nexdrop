name: Android Debug APK

# Mobile-only owner path (mission 2026-10-03): no Android Studio, phone only.
# GitHub → Actions → NexDrop-debug.apk artifact (+ Release) → download →
# install → test the REAL native NDT1 TCP transport.
#
# The APK is a real build of android/ (:ndt1 transport library + :app phone
# client + :tv receive-only). The PWA (WebRTC) is untouched by this workflow.

on:
  push:
    branches: ['main']
    paths: ['android/**', '.github/workflows/android-build.yml', '.github/scripts/android-smoke.sh']
  workflow_dispatch:
    inputs:
      internal:
        description: 'Internal diagnostic build — build+test but do NOT publish a release'
        type: boolean
        default: false

permissions:
  contents: write # create the Release with the attached APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (with cmdline-tools) already;
      # the android-actions/setup-android action broke on the runner image
      # ("Failed to find package 'tools'"), so accept licenses directly.
      - name: Android SDK (preinstalled; accept licenses)
        working-directory: android
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            "$SDKM" --version
            yes | "$SDKM" --licenses > /dev/null || true
            echo "licenses accepted via $SDKM"
          else
            echo "sdkmanager not found (runner SDK licenses are pre-accepted); continuing"
          fi

      - name: Gradle wrapper sanity (real wrapper, committed in-repo)
        working-directory: android
        run: ./gradlew --version

      # Production regression matrix (2026-10-04): LocalNet selection incl.
      # the CGNAT regression, NDT1 TCP both ways, telemetry honesty (the
      # negative-sustainedMBps bug), QR expiry/tamper, and the large-transfer
      # suite (358 MiB + 1 GiB SHA-verified, wire pause/resume, user cancel
      # cleanup, disconnect/resume, wrong-session reject, dead endpoint).
      - name: Unit tests — LocalNet + wire + telemetry + large-transfer regressions
        working-directory: android
        # Sequential, not one gradle invocation: compiling the :app test
        # source set in parallel perturbed the frozen engine's
        # AsyncDurableWriterTest fsync-coalescing timing window on busy
        # runners (v1.5 Phase C). Engine tests get a quiet runner first.
        run: |
          ./gradlew --no-daemon --stacktrace :ndt1:testDebugUnitTest
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload ndt1 test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ndt1-test-report
          path: android/ndt1/build/reports/tests/
          if-no-files-found: ignore

      - name: Build :app debug APK (native NDT1)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build :tv debug APK (receive-only)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :tv:assembleDebug

      - name: Verify the APK is real (not a fake/mock shell)
        working-directory: android
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          # The real NDT1 classes must be inside the APK
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/apkcheck
          for token in "com/nexdrop/ndt1/TurboSender" "com/nexdrop/ndt1/TurboReceiver" "com/nexdrop/ndt1/MainActivity"; do
            if ! grep -qa "$token" /tmp/apkcheck/classes*.dex; then
              echo "MISSING $token in APK — refusing to upload a fake APK"; exit 1
            fi
          done
          echo "APK verified: real NDT1 sender/receiver + phone UI present"

      - name: Startup guard — every manifest component must resolve to a REAL class
        working-directory: android
        run: |
          set -eu
          MERGED="$(find app/build/intermediates -path '*merged_manifests*debug*' -name 'AndroidManifest.xml' | head -1)"
          test -n "$MERGED" || { echo "merged manifest not found"; exit 1; }
          python3 - "$MERGED" <<'PYEOF'
          import sys, re, zipfile
          import xml.etree.ElementTree as ET
          merged, = sys.argv[1:]
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          z = zipfile.ZipFile(apk)
          dex = b"".join(z.read(n) for n in z.namelist() if re.match(r'classes\d*\.dex', n))
          ns = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse(merged).getroot()
          declared = []
          for tag in ('activity', 'activity-alias', 'service', 'receiver', 'provider'):
              for node in root.iter(tag):
                  name = node.get(ns + 'name')
                  if not name:
                      continue
                  if name.startswith('.'):
                      pkg = root.get('package')
                      name = pkg + name
                  declared.append((tag, name))
          # dex descriptors store classes slash-form: Lcom/nexdrop/ndt1/MainActivity;
          missing = [(t, n) for (t, n) in declared if n.startswith('com.nexdrop.') and n.replace('.', '/').encode() not in dex]
          if missing:
              for t, n in missing:
                  print(f"manifest declares {t} {n} but that class is NOT in the APK dex")
              print("STARTUP GUARD FAILED — the app would crash on launch with ClassNotFoundException")
              sys.exit(1)
          names = [n for _, n in declared]
          for must in ("com.nexdrop.ndt1.MainActivity", "com.nexdrop.ndt1.TransferService"):
              if must not in names:
                  print(f"expected component {must} missing from merged manifest")
                  sys.exit(1)
          print("startup guard OK: %d components declared, all resolve to real classes" % len(declared))
          PYEOF

      - name: Restore the release keystore (repo secret — never committed)
        run: |
          set -eu
          echo "${{ secrets.NEXDROP_RELEASE_KEYSTORE_B64 }}" | base64 -d > "$HOME/nexdrop-release.keystore"
          test -s "$HOME/nexdrop-release.keystore"
          echo "NEXDROP_KEYSTORE_FILE=$HOME/nexdrop-release.keystore" >> "$GITHUB_ENV"
          echo "NEXDROP_KEYSTORE_PASSWORD=${{ secrets.NEXDROP_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "NEXDROP_KEY_PASSWORD=${{ secrets.NEXDROP_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build :app SIGNED release APK (production signing pipeline)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify the signed release APK cryptographically
        working-directory: android
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || { echo "signed release APK missing"; ls -la app/build/outputs/apk/release/; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "apksigner not found in build-tools"; exit 1; }
          # (a) SIGNED: apksigner verify fails on a tampered/unsigned APK
          "$APKSIGNER" verify "$APK"
          # (b) modern signing scheme present (v2 mandatory on API 30+)
          "$APKSIGNER" verify -v "$APK" | tee /tmp/apksigner-v.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner-v.txt
          # (c) certificate of the real release key (not the debug key)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner-certs.txt
          grep -q "CN=NexDrop Release" /tmp/apksigner-certs.txt
          # (d) zip integrity
          unzip -t "$APK" > /dev/null && echo "zip integrity: OK"
          # (e) package/version identity (aapt from the Android SDK)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -q "name='com.nexdrop.ndt1'" /tmp/badging.txt
          # Expected version comes from the gradle file — never a hardcoded pin
          # (a pin silently broke this gate on the first version bump).
          VEXP_CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          VEXP_NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          test -n "$VEXP_CODE" && test -n "$VEXP_NAME"
          grep -q "versionCode='$VEXP_CODE'" /tmp/badging.txt
          grep -q "versionName='$VEXP_NAME'" /tmp/badging.txt
          echo "SIGNED RELEASE APK VERIFIED (signature, scheme, identity, integrity)"

      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NexDrop-debug.apk
          cp android/tv/build/outputs/apk/debug/tv-debug.apk NexDropTV-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk NexDrop-release.apk
          ls -la NexDrop*.apk

      - name: Upload NexDrop-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexDrop-debug.apk
          path: NexDrop-debug.apk
          if-no-files-found: error

      - name: Upload NexDropTV-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexDropTV-debug.apk
          path: NexDropTV-debug.apk
          if-no-files-found: error

      - name: Upload NexDrop-release.apk artifact (SIGNED production)
        uses: actions/upload-artifact@v4
        with:
          name: NexDrop-release.apk
          path: NexDrop-release.apk
          if-no-files-found: error

  # Real launch verification (mission §8): the APK must actually start.
  # This job would have caught the shipped launch crash — the emulator
  # fails the run unless MainActivity appears with no FATAL EXCEPTION.
  startup-smoke:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (smoke-test script)
        uses: actions/checkout@v4

      - name: Download NexDrop-release.apk artifact (smoke the SIGNED APK)
        uses: actions/download-artifact@v4
        with:
          name: NexDrop-release.apk

      # ubuntu-latest has KVM but the runner user is not in the kvm group
      # (ProbeKVM: "This user doesn't have permissions to use KVM"), which
      # forced TCG software emulation — an API 36 image cannot cold-boot
      # under TCG in the action's default 600 s. Open the device node.
      - name: Grant KVM access
        run: sudo chmod 666 /dev/kvm || true

      # Real-data pass tooling: zxing-cpp decodes the receiver QR from the
      # screenshot; tsx runs companion/src/cli.ts (zero npm deps) as the
      # sender through the emulator tunnel.
      - name: Install QR-decode + TS runner tools
        run: |
          pip3 install --quiet zxing-cpp pillow
          npx --yes tsx --version

      # v1.5 Phase C: gradle (JDK 17) runs the instrumented preview tests
      # inside the emulator-runner script.
      - name: Set up JDK 17 (smoke-side gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Boot Android 16 (API 36) emulator and run the startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          emulator-boot-timeout: 1800
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-smoke.sh"

      - name: Upload logcat (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat
          path: |
            logcat.txt
            ui.xml
          if-no-files-found: ignore

      # Screen-by-screen emulator captures of the shipped mockup UI, so the
      # owner can compare against the HTML mockup without a local emulator.
      - name: Upload screen-by-screen mockup comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: screenshots/
          if-no-files-found: ignore

  release:
    needs: [apk, startup-smoke]
    # v1.4.1-rc1: internal diagnostic builds (dispatch with internal=true)
    # build + test on any branch but never publish a release or tag.
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.internal }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: NexDrop-debug.apk
      - name: Download TV APK artifact
        uses: actions/download-artifact@v4
        with:
          name: NexDropTV-debug.apk
      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: NexDrop-release.apk

      - name: Generate release verification report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sudo apt-get -yq install apksigner aapt > /dev/null 2>&1 || true
          command -v aapt >/dev/null || { echo "aapt unavailable"; exit 1; }
          APK=NexDrop-release.apk
          # Real version from the APK itself — never hardcode
          BADGE=$(aapt dump badging "$APK" 2>/dev/null | head -1)
          VNAME=$(echo "$BADGE" | grep -oE "versionName='[^']+'" | cut -d"'" -f2)
          VCODE=$(echo "$BADGE" | grep -oE "versionCode='[0-9]+'" | cut -d"'" -f2)
          test -n "$VNAME" && test -n "$VCODE"
          SIZE=$(stat -c%s "$APK")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          CERTS=$(apksigner verify --print-certs "$APK" || true)
          CERT_SHA256=$(echo "$CERTS" | grep -i "certificate SHA-256 digest" | grep -oE '[0-9a-fA-F]{64}' | head -1)
          SCHEMES=$(apksigner verify -v "$APK" | grep "Verified using" | grep ": true" | sed 's/^ *//' || true)
          {
            echo "# NexDrop release verification report"
            echo
            echo "- APK filename: $APK"
            echo "- versionName / versionCode: $VNAME / $VCODE"
            echo "- package / applicationId: com.nexdrop.ndt1"
            echo "- APK size: $SIZE bytes"
            echo "- APK SHA-256 (integrity): $SHA256"
            echo "- signing certificate SHA-256 fingerprint: $CERT_SHA256"
            echo "- signing schemes verified:"
            echo "$SCHEMES" | sed 's/^/  - /'
            echo "- build result: PASS (:app:assembleRelease with release signingConfig, keystore from repo secret, never committed)"
            echo "- signature verification: PASS (apksigner verify + scheme check + certificate identity CN=NexDrop Release)"
            echo "- install smoke-test result: PASS (API 36 emulator — the startup-smoke job installed and launched THIS signed APK; this release only runs if that job succeeded)"
            echo "- zip integrity: PASS (unzip -t in the apk job)"
          } | tee RELEASE-VERIFICATION.md
          # The report must be real: fail if any expected value is empty
          test -n "$CERT_SHA256" && test -n "$SCHEMES"

      - name: Create GitHub Release (signed release + debug APKs + report)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sudo apt-get -yq install aapt > /dev/null 2>&1 || true
          command -v aapt >/dev/null || { echo "aapt unavailable"; exit 1; }
          TAG="nexdrop-android-v${GITHUB_SHA::7}"
          BADGE=$(aapt dump badging NexDrop-release.apk 2>/dev/null | head -1)
          VNAME=$(echo "$BADGE" | grep -oE "versionName='[^']+'" | cut -d"'" -f2)
          VCODE=$(echo "$BADGE" | grep -oE "versionCode='[0-9]+'" | cut -d"'" -f2)
          test -n "$VNAME" && test -n "$VCODE"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "NexDrop Android $GITHUB_SHA" \
              --notes "Built from $GITHUB_SHA by GitHub Actions.
          PRODUCTION: NexDrop-release.apk (v$VNAME, code $VCODE) — SIGNED with the dedicated NexDrop release key (certificate SHA-256 fingerprint in RELEASE-VERIFICATION.md). Installs directly on modern Android (v2+v3 signing schemes verified, API 36 emulator install smoke passed).
          ENGINEERING: NexDrop-debug.apk (debug-signed). NexDropTV-debug.apk is the optional receive-only TV client.
          Contains the verified native NDT1 TCP transport (TurboSender/TurboReceiver), ONE-QR pairing, Accept/Decline, pause/resume/cancel, streaming SHA-256 verification, honest telemetry, production UI, and the PWA (WebRTC) fallback. Benchmarks live under Settings → Device Test." \
              --prerelease
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" NexDrop-release.apk NexDrop-debug.apk NexDropTV-debug.apk RELEASE-VERIFICATION.md --clobber
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
