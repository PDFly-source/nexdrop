<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NexDrop — Android App Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070A10;--s:#101722;--e:#151E2B;--p:#18D6C5;--b:#4C8DFF;--ok:#35D07F;--t:#F5F7FA;--m:#9AA6B2;--ln:rgba(255,255,255,.08);--d:Sora,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{height:100%}
body{background:radial-gradient(55% 38% at 15% 0%,rgba(24,214,197,.20),transparent 70%),radial-gradient(50% 40% at 92% 8%,rgba(76,141,255,.22),transparent 70%),radial-gradient(60% 35% at 50% 100%,rgba(24,214,197,.12),transparent 70%),#04060B;color:var(--t);font:14px/1.38 Manrope,"Segoe UI",Roboto,sans-serif;padding:48px 0 90px;min-height:100%}
.wrap{overflow-x:auto;padding:0 40px 20px}.grid{display:grid;grid-template-columns:repeat(4,284px);gap:64px 40px;justify-content:center;width:max-content;margin:auto}
.grid>div:nth-child(even){transform:translateY(36px)}
.ph{width:284px;height:606px;border-radius:46px;padding:8px;position:relative;background:linear-gradient(145deg,#5b6577,#1b2230 30%,#0a0e15 65%,#434e60);box-shadow:0 0 0 1px #000,0 50px 80px -24px rgba(0,0,0,.9),0 0 100px -28px rgba(24,214,197,.45)}
.ph::before{content:"";position:absolute;right:-3px;top:130px;width:3px;height:64px;border-radius:2px;background:#2c3544}
.sc{height:100%;border-radius:38px;background:#070A10;overflow:hidden;position:relative;display:flex;flex-direction:column;padding:0 16px}
.sc::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 45% at 50% -8%,rgba(24,214,197,.24),transparent 62%),radial-gradient(90% 40% at 105% 105%,rgba(76,141,255,.18),transparent 65%)}
.sc>*{position:relative;z-index:1}
.sb{display:flex;justify-content:space-between;align-items:center;height:32px;font-size:11.5px;font-weight:700;padding:0 8px;margin:0 -4px;flex:none}
.sb i{width:10px;height:10px;border-radius:50%;background:#000;box-shadow:0 0 0 1.5px #1c2431;position:absolute;left:50%;top:10px;margin-left:-5px}
.gv{height:5px;width:96px;border-radius:3px;background:rgba(255,255,255,.35);margin:8px auto 7px;flex:none}
.cap{text-align:center;font:600 12.5px var(--d);letter-spacing:.02em;color:var(--m);margin-top:20px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid var(--ln);border-radius:22px;padding:14px;backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 28px -10px rgba(0,0,0,.7)}
.card.g{background:linear-gradient(155deg,rgba(24,214,197,.18),rgba(76,141,255,.07) 60%,rgba(255,255,255,.02))}
h1{font:700 27px/1.08 var(--d);letter-spacing:-.03em}h2{font:700 22px/1.15 var(--d);letter-spacing:-.02em}
.sub{color:var(--m);font-size:12.5px;margin-top:5px}.sm{font-size:11.5px;color:var(--m)}
.btn{height:50px;border-radius:17px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 13.5px var(--d);letter-spacing:.04em;background:linear-gradient(135deg,#34f0de,#18D6C5 45%,#3f86f7);color:#021a1a;flex:1;box-shadow:0 10px 22px -8px rgba(24,214,197,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.o{background:rgba(255,255,255,.06);color:var(--t);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}.btn.t{background:none;box-shadow:none;color:var(--p);height:36px}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.sp{flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(53,208,127,.2);flex:none;animation:pu 2.2s ease-out infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(53,208,127,.5)}100%{box-shadow:0 0 0 8px rgba(53,208,127,0)}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--p);background:rgba(24,214,197,.1);border:1px solid rgba(24,214,197,.25);border-radius:99px;padding:5px 11px}
.ic{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,rgba(24,214,197,.16),rgba(76,141,255,.08));border:1px solid rgba(24,214,197,.2);display:grid;place-items:center;color:var(--p);flex:none}
.nav{margin:auto 0 0;display:flex;justify-content:space-around;padding:10px 4px 8px;border-radius:24px;background:rgba(21,30,43,.8);backdrop-filter:blur(16px);border:1px solid var(--ln);box-shadow:0 12px 24px -8px rgba(0,0,0,.8);flex:none}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#6b7785}.nav .a{color:var(--p)}.nav .a svg{filter:drop-shadow(0 0 6px rgba(24,214,197,.8))}.nav svg{width:19px;height:19px}
.big{font:700 34px/1 var(--d);letter-spacing:-.04em}
.fill{margin-top:auto}
.sc svg[viewBox="0 0 150 150"]{filter:drop-shadow(0 0 12px rgba(24,214,197,.5))}
.qrw{box-shadow:0 0 0 5px rgba(24,214,197,.22),0 0 46px rgba(24,214,197,.35)}
.gt{background:linear-gradient(120deg,#34f0de,#4C8DFF);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
